<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Book Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="bg-animation">
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo"><i class="fas fa-robot"></i></div>
            <h1>Welcome Back</h1>
            <p>Sign in with Firebase to use AI Book Assistant</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                <i class="fas fa-envelope input-icon"></i>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                <i class="fas fa-lock input-icon"></i>
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginSubmit">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="divider"><span>or continue with</span></div>

        <div class="social-login">
            <button type="button" class="social-btn google" id="btnGoogle" title="Google"><i class="fab fa-google"></i></button>
            <button type="button" class="social-btn facebook" disabled title="Not enabled"><i class="fab fa-facebook-f"></i></button>
            <button type="button" class="social-btn github" disabled title="Not enabled"><i class="fab fa-github"></i></button>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="{{ url_for('register_page') }}">Sign up</a>
        </div>
    </div>

    <script>window.__FIREBASE_CONFIG__ = {{ firebase_config | tojson }};</script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="{{ url_for('static', filename='firebase-init.js') }}"></script>
    <script>
        (function () {
            var home = {{ url_for('index')|tojson }};

            function showErr(msg) {
                alert(msg);
            }

            document.getElementById('loginForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                if (!window.firebaseReady) {
                    showErr('Firebase is not configured. Add FIREBASE_WEB_* keys to the server .env file.');
                    return;
                }
                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value;
                var btn = document.getElementById('loginSubmit');
                btn.disabled = true;
                try {
                    await firebase.auth().signInWithEmailAndPassword(email, password);
                    window.location.href = home;
                } catch (err) {
                    showErr(err.message || 'Login failed');
                } finally {
                    btn.disabled = false;
                }
            });

            document.getElementById('btnGoogle').addEventListener('click', async function () {
                if (!window.firebaseReady) {
                    showErr('Firebase is not configured.');
                    return;
                }
                try {
                    var provider = new firebase.auth.GoogleAuthProvider();
                    await firebase.auth().signInWithPopup(provider);
                    window.location.href = home;
                } catch (err) {
                    if (err.code !== 'auth/popup-closed-by-user') {
                        showErr(err.message || 'Google sign-in failed');
                    }
                }
            });

            document.getElementById('forgotLink').addEventListener('click', async function (e) {
                e.preventDefault();
                if (!window.firebaseReady) return;
                var email = document.getElementById('email').value.trim();
                if (!email) {
                    showErr('Enter your email above first.');
                    return;
                }
                try {
                    await firebase.auth().sendPasswordResetEmail(email);
                    alert('Password reset email sent.');
                } catch (err) {
                    showErr(err.message);
                }
            });

            firebase.auth().onAuthStateChanged(function (user) {
                if (user) {
                    window.location.href = home;
                }
            });
        })();
    </script>
</body>
</html>
