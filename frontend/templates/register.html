<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Book Assistant</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- FIXED CSS PATH -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        .register-container {
            width: 450px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .name-fields {
            display: flex;
            gap: 15px;
        }

        .name-fields .form-group {
            flex: 1;
        }

        .terms {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 20px;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .name-fields {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="bg-animation">
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="login-container register-container">

        <div class="login-header">
            <div class="logo">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>Create Account</h1>
            <p>Register with Firebase to save your books in the cloud</p>
        </div>

        <form id="registerForm">

            <div class="name-fields">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" placeholder="John" required>
                    <i class="fas fa-user input-icon"></i>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" placeholder="Doe" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="john@example.com" required>
                <i class="fas fa-envelope input-icon"></i>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>

            <p class="terms">
                By creating an account, you agree to our 
                <a href="#">Terms</a> and 
                <a href="#">Privacy Policy</a>
            </p>

            <button type="submit" class="login-btn" id="registerSubmit">
                <i class="fas fa-user-plus"></i> Create Account
            </button>

        </form>

        <div class="divider"><span>or sign up with</span></div>

        <div class="social-login">
            <button type="button" class="social-btn google" id="btnGoogleReg">
                <i class="fab fa-google"></i>
            </button>
        </div>

        <div class="signup-link">
            Already have an account?
            <a href="{{ url_for('login_page') }}">Login</a>
        </div>

    </div>

</body>
</html>
